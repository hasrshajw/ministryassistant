name: Restore BackupScreen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore BackupScreen from known-good commit
        run: |
          set -euo pipefail
          # Commit that still had the full BackupScreen (Material 3 1.5.0 bump)
          GOOD=86755ec0beb7dcc7309c95db06a18de9634a0012
          git checkout "$GOOD" -- app/src/main/java/com/harsha/myapplication/ui/settings/BackupScreen.kt
          # Material 3 1.5.0 rename
          sed -i 's/SplitButtonLayout(/SplitButton(/g' app/src/main/java/com/harsha/myapplication/ui/settings/BackupScreen.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/harsha/myapplication/ui/settings/BackupScreen.kt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Restore BackupScreen.kt and rename SplitButtonLayout to SplitButton"
          git push origin HEAD:main
